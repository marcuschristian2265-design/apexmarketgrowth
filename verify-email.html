  <style>
    :root { --maroon: #861535; --maroon-dark: #6d102b; }
    body { font-family: 'Poppins', sans-serif; margin: 0; }
    .btn-primary { background: var(--maroon); color: #fff; transition: background .2s; }
    .btn-primary:hover { background: var(--maroon-dark); }
    .input-field {
      width: 100%; border: 1.5px solid #e5e7eb; border-radius: 12px;
      padding: 0 16px; height: 50px; font-size: 14px; outline: none;

    }
    .input-field:focus { border-color: var(--maroon); }
    .bg-hero {
      background-image: url('https://images.unsplash.com/photo-1559526324-593bc073d938?auto=format&fit=crop&w=2400&q=80');

    }
    .bg-hero::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(to bottom right, rgba(134,21,53,.85), rgba(0,0,0,.7));
    }
    .error-msg { display: none; color: #dc2626; font-size: 13px; margin-top: 6px; }

<style>
  .otp{width:48px;height:56px;text-align:center;font-size:24px;font-weight:700;border:1.5px solid #e5e7eb;border-radius:12px;outline:none;font-family:'Poppins',sans-serif}
  .otp:focus{border-color:var(--maroon)}
</style>
<body class="bg-gray-50 min-h-screen flex items-center justify-center px-6 py-12">
  <div class="w-full max-w-md text-center">
    <a href="index.html" class="text-3xl font-black tracking-widest" style="color:var(--maroon)">AMG.</a>
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8 mt-8">
      <h1 class="text-2xl font-black text-gray-900">Verify your email</h1>
      <p class="mt-2 text-gray-500 text-sm">We sent a 6-digit code to<br><strong id="emailShow" class="text-gray-800"></strong></p>
      <div class="flex justify-center gap-2 mt-6" id="otpRow">
        <input class="otp" maxlength="1" inputmode="numeric" /><input class="otp" maxlength="1" inputmode="numeric" /><input class="otp" maxlength="1" inputmode="numeric" />
        <input class="otp" maxlength="1" inputmode="numeric" /><input class="otp" maxlength="1" inputmode="numeric" /><input class="otp" maxlength="1" inputmode="numeric" />
      </div>
      <div id="msg" class="hidden mt-4 rounded-xl px-4 py-3 text-sm"></div>
      <button id="verifyBtn" onclick="verifyCode()" class="btn-primary w-full py-4 rounded-xl font-semibold text-base mt-6">Verify</button>
      <p class="text-sm text-gray-500 mt-5">Didn't get it? <button id="resendBtn" onclick="sendCode()" class="font-semibold" style="color:var(--maroon)">Resend code</button> <span id="timer" class="text-gray-400"></span></p>
      <p class="text-xs text-gray-400 mt-3">Check your spam folder if you can't find it.</p>
      <button onclick="logout()" class="text-xs text-gray-400 hover:text-gray-600 mt-4">Use a different account</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";
    const app = initializeApp({
      apiKey: "AIzaSyDrwqA-_CK-22E7PsNlSAIw-bXWN6Dl-mU", authDomain: "apexmarketgrowth.firebaseapp.com",
      projectId: "apexmarketgrowth", storageBucket: "apexmarketgrowth.firebasestorage.app",
      messagingSenderId: "81223871224", appId: "1:81223871224:web:1cf05fadc6e24f90aee90d"
    });
    const auth = getAuth(app), db = getFirestore(app);
    let me = null, cooldown = null;
    const boxes = [...document.querySelectorAll('.otp')];

    function show(text, ok) {
      const m = document.getElementById('msg');
      m.textContent = text; m.classList.remove('hidden','bg-red-50','text-red-700','bg-green-50','text-green-700');
      m.classList.add(...(ok ? ['bg-green-50','text-green-700'] : ['bg-red-50','text-red-700']));
    }
    function startTimer() {
      let n = 45; const b = document.getElementById('resendBtn'), t = document.getElementById('timer');
      b.disabled = true; clearInterval(cooldown);
      cooldown = setInterval(() => { n--; t.textContent = '(' + n + 's)'; if (n <= 0) { clearInterval(cooldown); b.disabled = false; t.textContent = ''; } }, 1000);
    }
    async function call(path, body) {
      const token = await me.getIdToken();
      const r = await fetch('/api/' + path, { method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer ' + token}, body: JSON.stringify(body||{}) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || 'Something went wrong. Please try again.');
      return j;
    }
    window.sendCode = async function() {
      try { await call('send-otp'); show('A new code was sent to your email.', true); startTimer(); }
      catch (e) { show(e.message, false); }
    };
    window.verifyCode = async function() {
      const code = boxes.map(b => b.value).join('');
      if (code.length !== 6) return show('Enter all 6 digits.', false);
      const btn = document.getElementById('verifyBtn'); btn.disabled = true; btn.textContent = 'Verifying...';
      try {
        await call('verify-otp', { code });
        await me.getIdToken(true);
        show('Email verified! Redirecting...', true);
        const hasSeed = sessionStorage.getItem('amg_seed');
        setTimeout(() => { window.location.href = hasSeed ? 'seedphrase.html' : 'user-dashboard.html'; }, 800);
      } catch (e) { show(e.message, false); btn.disabled = false; btn.textContent = 'Verify'; }
    };
    window.logout = async function() { await signOut(auth); window.location.href = 'login.html'; };

    boxes.forEach((b, i) => {
      b.addEventListener('input', () => { b.value = b.value.replace(/\D/g,''); if (b.value && boxes[i+1]) boxes[i+1].focus(); });
      b.addEventListener('keydown', e => { if (e.key === 'Backspace' && !b.value && boxes[i-1]) boxes[i-1].focus(); if (e.key === 'Enter') window.verifyCode(); });
      b.addEventListener('paste', e => {
        const t = (e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,6); if (!t) return;
        e.preventDefault(); t.split('').forEach((c, k) => boxes[k].value = c); boxes[Math.min(t.length,5)].focus();
      });
    });

    onAuthStateChanged(auth, async u => {
      if (!u) { window.location.href = 'login.html'; return; }
      me = u; document.getElementById('emailShow').textContent = u.email;
      const snap = await getDoc(doc(db, 'users', u.uid));
      if (snap.exists() && snap.data().otpPending !== true) { window.location.href = 'user-dashboard.html'; return; }
      boxes[0].focus();
      window.sendCode();
    });
  </script>
</body>
</html>
